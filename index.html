<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Roll through the sky and grab every star.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Selena Roller">
<meta name="theme-color" content="#8fd3ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Selena Roller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap">
<style>
[hidden] { display: none !important; }
html, body { margin: 0; }
body { -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
/* Layout: full-screen 3D sky course. HUD pinned to the top edge, helper badges under it,
   menus are glass panels that sit low on the screen near the thumb. */
:root {
  --sky: #a7cbe6;
  --text: #ffffff;
  --muted: #c4d0ea;
  --ink: #0e1730;
  --glass: rgba(14, 22, 48, 0.82);
  --glass-top: rgba(40, 58, 112, 0.84);
  --glass-edge: rgba(255, 255, 255, 0.18);
  --chip: rgba(255, 255, 255, 0.10);
  --chip-hi: rgba(255, 255, 255, 0.18);
  --chip-edge: rgba(255, 255, 255, 0.16);
  --go: #22c463; --go-top: #5cf096; --go-deep: #127a3c;
  --blue: #2d84f5; --blue-top: #6db4ff; --blue-deep: #1a4fa8;
  --gold: #ffc531; --gold-top: #ffe27d; --gold-deep: #b97a00;
  --pink: #ff4f9e; --violet: #8a5cff;
  --jump: #39e06c; --fly: #45bfff; --magnet: #ff4fae; --shield: #4fe9ff;
  --hud-bg: rgba(12, 20, 44, 0.62);
  --shade: rgba(4, 9, 24, 0.5);
  --display: "Rubik", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky: #4b739a; } }
:root[data-theme="dark"] { --sky: #4b739a; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; margin: 0; }
body {
  background: var(--sky); color: var(--text); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; -webkit-font-smoothing: antialiased;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; padding: 0; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
button:disabled { opacity: 0.3; cursor: default; }
svg { display: block; }
.ico { width: 24px; height: 24px; }

/* Glass panels and chunky buttons */
.panel {
  position: relative; width: 100%; max-width: 410px; box-sizing: border-box;
  background: linear-gradient(180deg, var(--glass-top), var(--glass));
  border: 1px solid var(--glass-edge); border-radius: 30px; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 26px 50px rgba(2, 6, 20, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2), inset 0 -3px 0 rgba(0, 0, 0, 0.22);
  -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
}
.panel.center { text-align: center; align-items: stretch; overflow: hidden; }
h2 {
  font-family: var(--display); font-weight: 900; font-size: 34px; margin: 0; letter-spacing: 0.01em;
  text-transform: uppercase; text-wrap: balance; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
}
.btn {
  --c: var(--blue); --c-top: var(--blue-top); --c-deep: var(--blue-deep);
  position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 58px; padding: 10px 20px; border-radius: 20px; box-sizing: border-box;
  font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.02em; text-transform: uppercase;
  color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
  background: linear-gradient(180deg, var(--c-top) 0%, var(--c) 58%);
  box-shadow: 0 6px 0 var(--c-deep), 0 12px 22px rgba(0, 0, 0, 0.32), inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.12);
  transition: transform 0.06s, box-shadow 0.06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c-deep), 0 5px 10px rgba(0, 0, 0, 0.3), inset 0 2px 0 rgba(255, 255, 255, 0.5); }
.btn svg { width: 26px; height: 26px; flex: none; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.22)); }
.btn.go { --c: var(--go); --c-top: var(--go-top); --c-deep: var(--go-deep); }
.btn.big { min-height: 74px; font-size: clamp(24px, 7.4vw, 32px); border-radius: 24px; }
.btn.big span { white-space: nowrap; }
.btn.big svg { width: 32px; height: 32px; }
.btn.ghost {
  --c: rgba(255, 255, 255, 0.12); --c-top: rgba(255, 255, 255, 0.2); --c-deep: rgba(0, 0, 0, 0.32);
  font-size: 19px; min-height: 54px; box-shadow: 0 5px 0 var(--c-deep), inset 0 1px 0 rgba(255, 255, 255, 0.22);
}
.btn.ghost:active { box-shadow: 0 1px 0 var(--c-deep), inset 0 1px 0 rgba(255, 255, 255, 0.22); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; flex: none; box-sizing: border-box;
  background: var(--hud-bg); border: 1px solid var(--chip-edge); border-radius: 999px;
  padding: 6px 14px 6px 8px; min-height: 46px;
  font-family: var(--display); font-weight: 900; font-size: 20px; font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
}
.pill svg { width: 30px; height: 30px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.25)); }
.pop { animation: pop 0.32s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }

/* HUD */
.hud {
  position: absolute; left: 0; right: 0; top: 0; box-sizing: border-box;
  display: flex; align-items: center; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
}
.hbtn {
  pointer-events: auto; width: 50px; height: 50px; flex: none; border-radius: 18px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08)), var(--hud-bg);
  border: 1px solid var(--chip-edge); display: grid; place-items: center;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
}
.hbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
.hbtn svg { width: 24px; height: 24px; }
.lvlbox {
  flex: 1; min-width: 0; background: var(--hud-bg); border: 1px solid var(--chip-edge);
  border-radius: 18px; padding: 6px 12px 9px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
}
.lvltop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; line-height: 1.1; }
.lvllabel { flex: none; white-space: nowrap; font-family: var(--display); font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: 0.03em; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3); }
.lvlworld { min-width: 0; font-weight: 700; font-size: 14px; color: #dbe4f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { position: relative; height: 12px; border-radius: 99px; background: rgba(0, 0, 0, 0.35); margin-top: 5px; box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.35); }
.fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 99px; transform-origin: left center; transform: scaleX(0);
  background: linear-gradient(180deg, #8fe3ff, #2d9bff 60%, #1f6fe0);
}
.bar .flag { position: absolute; right: -6px; top: 50%; width: 22px; height: 22px; margin-top: -15px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)); }

.hud2 {
  position: absolute; left: 0; right: 0; box-sizing: border-box;
  top: calc(env(safe-area-inset-top, 0px) + 76px);
  display: flex; align-items: flex-start; justify-content: space-between;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bonuswrap { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.badge { position: relative; width: 64px; height: 64px; border-radius: 50%; background: var(--hud-bg); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); }
.badge .ring { position: absolute; inset: 0; width: 64px; height: 64px; transform: rotate(-90deg); }
.badge .ring circle { fill: none; stroke-width: 6; }
.badge .ring .trk { stroke: rgba(255, 255, 255, 0.16); }
.badge .ring .prog { stroke: var(--bc, var(--jump)); stroke-linecap: round; stroke-dasharray: 163.4; stroke-dashoffset: 0; }
.badge .bico { position: absolute; left: 14px; top: 14px; width: 36px; height: 36px; color: var(--bc, var(--jump)); filter: drop-shadow(0 0 6px var(--bc, var(--jump))); }
.badge.ending { animation: endpulse 1s ease-in-out infinite; }
@keyframes endpulse { 50% { transform: scale(0.9); opacity: 0.75; } }
.queued { width: 38px; height: 38px; border-radius: 50%; background: var(--hud-bg); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
.queued svg { width: 24px; height: 24px; color: var(--qc, var(--fly)); }
.meter { position: relative; width: 66px; height: 66px; border-radius: 50%; background: var(--hud-bg); border: 1px solid var(--chip-edge); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); }
.meter svg { width: 66px; height: 66px; }
.meter.full { animation: meterburst 0.7s ease-out; }
@keyframes meterburst { 0% { transform: scale(1); } 30% { transform: scale(1.35); box-shadow: 0 0 0 10px rgba(255, 197, 49, 0.35); } 100% { transform: scale(1); } }

/* Big friendly helper announcement: low on the screen, over track the ball has already passed */
.announce {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); z-index: 4;
  transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: max-content; max-width: calc(100% - 32px);
}
.announce.show { animation: annIn 0.5s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes annIn { from { transform: translateX(-50%) scale(0.3); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
.aicon {
  width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.95), var(--ac, var(--jump)) 62%);
  box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.6), 0 0 36px var(--ac, var(--jump)), 0 10px 0 rgba(0, 0, 0, 0.2);
}
.aicon svg { width: 56px; height: 56px; color: #fff; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.25)); }
.atext {
  font-family: var(--display); font-weight: 900; font-size: clamp(32px, 10vw, 46px); text-transform: uppercase;
  letter-spacing: 0.02em; text-align: center; text-wrap: balance; color: #fff; line-height: 1;
  text-shadow: 0 3px 0 var(--ac, var(--jump)), 0 6px 0 rgba(0, 0, 0, 0.35), 0 10px 20px rgba(0, 0, 0, 0.35);
}

/* Toast, steer hint, tap to go */
.toast {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 96px); z-index: 5;
  transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  font-family: var(--display); font-weight: 900; font-size: clamp(26px, 7.4vw, 36px); text-transform: uppercase;
  text-align: center; text-wrap: balance; letter-spacing: 0.02em; color: #fff; line-height: 1.05;
  text-shadow: 0 3px 0 rgba(10, 30, 80, 0.75), 0 8px 18px rgba(0, 0, 0, 0.35);
}
.toast.show { animation: toastIn 0.35s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes toastIn { from { transform: translateX(-50%) scale(0.4); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
.hint, .tapgo {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 54px);
  transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px;
  width: max-content; max-width: calc(100% - 32px);
  font-family: var(--display); font-weight: 900; font-size: 24px; text-transform: uppercase; color: #fff;
  text-shadow: 0 3px 0 rgba(10, 30, 80, 0.7);
}
.hint span, .tapgo span { text-align: center; }
.track-line { width: 190px; height: 10px; border-radius: 9px; background: rgba(255, 255, 255, 0.45); position: relative; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2); }
.finger {
  position: absolute; top: 50%; left: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px;
  border-radius: 50%; background: #fff; box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.35), 0 4px 0 rgba(0, 0, 0, 0.25);
  animation: swipe 1.6s ease-in-out infinite;
}
@keyframes swipe { 0%, 100% { transform: translateX(-70px); } 50% { transform: translateX(70px); } }
.tapring { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.92); box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.35); animation: tap 1.1s ease-in-out infinite; }
.tapring svg { width: 44px; height: 44px; color: var(--blue-deep); }
@keyframes tap { 50% { transform: scale(0.86); box-shadow: 0 0 0 16px rgba(255, 255, 255, 0.12); } }

/* Screens */
.screen {
  position: absolute; inset: 0; pointer-events: auto; z-index: 3; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  background: var(--shade);
}
.menu { justify-content: space-between; background: linear-gradient(to top, rgba(4, 9, 24, 0.55), rgba(4, 9, 24, 0) 58%); }
.brand { display: flex; flex-direction: column; align-items: center; padding-top: 6px; }
.logo { font-family: var(--display); font-weight: 900; margin: 0; line-height: 0.86; display: flex; flex-direction: column; align-items: center; text-transform: uppercase; transform: rotate(-3deg); }
.logo span { display: block; letter-spacing: 0.01em; }
.logo .l1 {
  font-size: clamp(58px, 17vw, 92px); color: #fff;
  text-shadow: 0 3px 0 #ff5aa6, 0 6px 0 #c22f73, 0 9px 0 #7d1b4b, 0 16px 24px rgba(0, 0, 0, 0.45);
}
.logo .l2 {
  font-size: clamp(40px, 12vw, 64px); color: var(--gold);
  text-shadow: 0 3px 0 #e48a00, 0 6px 0 #9a5200, 0 12px 20px rgba(0, 0, 0, 0.45);
}
.tag { margin: 18px 0 0; font-weight: 800; font-size: 16px; text-align: center; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45), 0 0 12px rgba(0, 0, 0, 0.35); }
.levelpick { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.levelpick .mid { text-align: center; min-width: 0; }
.levelpick small { display: block; font-weight: 800; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.levelpick strong { display: block; font-family: var(--display); font-weight: 900; font-size: 32px; text-transform: uppercase; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
.arrow {
  width: 54px; height: 54px; border-radius: 18px; flex: none; display: grid; place-items: center;
  background: linear-gradient(180deg, var(--chip-hi), var(--chip)); border: 1px solid var(--chip-edge);
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.arrow:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.32); }
.arrow svg { width: 26px; height: 26px; }
.seglabel { font-weight: 800; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: -6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 9px; border-radius: 16px;
  font-weight: 800; font-size: 15px; background: var(--chip); border: 1px solid var(--chip-edge);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
}
.seg button svg { width: 30px; height: 22px; }
.seg button[aria-pressed="true"] {
  background: linear-gradient(180deg, var(--gold-top), var(--gold)); color: #3b2500; border-color: transparent;
  box-shadow: 0 4px 0 var(--gold-deep), inset 0 2px 0 rgba(255, 255, 255, 0.55);
}
.agehint { margin: -4px 0 0; font-size: 15px; font-weight: 700; color: var(--muted); text-align: center; }
.row { display: flex; gap: 10px; align-items: stretch; }
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 1 1 0; min-width: 0;
  background: linear-gradient(180deg, var(--chip-hi), var(--chip)); border: 1px solid var(--chip-edge);
  font-weight: 800; font-size: 15px; border-radius: 16px; padding: 8px 8px; min-height: 50px; white-space: nowrap;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
.chip svg { width: 24px; height: 24px; flex: none; }
.chip .ballicon { width: 30px; height: 30px; flex: none; }
.row .pill { background: rgba(0, 0, 0, 0.28); }

/* Shop */
#shop { justify-content: flex-end; }
.shopcard { max-height: 78%; min-height: 0; }
.shophead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.shophead h2 { font-size: clamp(26px, 7.5vw, 34px); white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; overflow-y: auto; min-height: 0; flex: 1; padding: 4px 2px 8px; }
.ballitem {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
  border: 1px solid var(--chip-edge); border-radius: 20px; padding: 10px 4px 9px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
}
.ballitem canvas { width: 70px; height: 70px; }
.ballitem.locked canvas { filter: brightness(0.86); }
.ballitem.chosen { border-color: var(--gold); box-shadow: 0 4px 0 var(--gold-deep), 0 0 0 2px var(--gold) inset, 0 0 18px rgba(255, 197, 49, 0.35); }
.ballitem .nm { font-weight: 800; font-size: 13px; line-height: 1.1; text-align: center; }
.ballitem .st {
  font-family: var(--display); font-weight: 900; font-size: 15px; text-transform: uppercase; display: flex; align-items: center; gap: 3px;
  font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 99px; background: rgba(0, 0, 0, 0.3);
}
.ballitem.chosen .st { background: var(--gold); color: #3b2500; }
.ballitem .st.can { background: var(--go); }
.ballitem .st svg { width: 17px; height: 17px; }
.ballitem.shake { animation: shake 0.4s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

/* Level done */
.donecard { padding-top: 26px; }
.rays {
  position: absolute; left: 50%; top: 70px; width: 520px; height: 520px; margin: -260px 0 0 -260px; pointer-events: none; opacity: 0.35;
  background: repeating-conic-gradient(rgba(255, 214, 90, 0.55) 0deg 10deg, rgba(255, 214, 90, 0) 10deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 0%, transparent 62%); mask: radial-gradient(circle, #000 0%, transparent 62%);
  animation: spin 18s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ribbon {
  position: relative; align-self: center; font-family: var(--display); font-weight: 900; font-size: 30px; text-transform: uppercase;
  padding: 10px 26px; border-radius: 16px; background: linear-gradient(180deg, var(--go-top), var(--go));
  box-shadow: 0 6px 0 var(--go-deep), inset 0 2px 0 rgba(255, 255, 255, 0.5); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
}
.earn { position: relative; margin: 6px 0 0; font-family: var(--display); font-weight: 900; font-size: 54px; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 0 4px 0 var(--gold-deep), 0 10px 18px rgba(0, 0, 0, 0.35); }
.earn svg { width: 50px; height: 50px; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.25)); }
.note { position: relative; margin: -8px 0 4px; font-weight: 700; color: var(--muted); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(560px) rotate(720deg); opacity: 0.2; } }
.nogl { color: var(--text); }

@media (max-height: 560px) and (orientation: landscape) {

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const L = 2;            // one track step, metres
  const SUB = 2;          // track nodes per step
  const DS = L / SUB;     // metres between nodes
  const R = 0.5;          // ball radius
  const G = 22;           // gravity used for falls
  const START_S = 6.5;    // where the ball starts: far enough in that the chase camera is over the deck from the first frame
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0; let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
  const DEBUG = (() => { try { return /debug/i.test(String(window.location.href)); } catch (e) { return false; } })();
  let headless = false;   // true while the test bot runs a level without drawing

  // ---------- Saved progress (this device only) ----------
  const SAVE_KEY = 'selenaRoller.v1';
  let save = { stars: 0, best: 1, level: 1, skin: 'selena', owned: ['selena'], speed: 0, muted: false, hinted: false };
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
  const persist = () => { if (headless) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

  // ---------- Sound (made on the fly, started by the first tap) ----------
  let actx = null, master = null, noiseBuf = null, roll = null;
  function audio() {
    if (!actx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          actx = new AC();
          master = actx.createGain();
          master.gain.value = 0.9;
          master.connect(actx.destination);
          noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          const src = actx.createBufferSource();
          src.buffer = noiseBuf; src.loop = true;
          const f = actx.createBiquadFilter();
          f.type = 'lowpass'; f.frequency.value = 380; f.Q.value = 0.6;
          const g = actx.createGain();
          g.gain.value = 0;
          src.connect(f);
          f.connect(g);
          g.connect(master);
          src.start();
          roll = { f, g, last: 0 };
        }
      } catch (e) { actx = null; }
    }
    // Safari can report 'interrupted' (calls, Siri, lock screen) as well as 'suspended': retry on every tap
    if (actx && actx.state !== 'running' && actx.state !== 'closed') {
      try { const p = actx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    }
    return actx;
  }
  // Sounds are only scheduled while the context runs; a stopped clock would queue them up and play them all at once later.
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!actx || actx.state !== 'running' || save.muted || headless) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, f0, f1, q, delay, ftype) {
    if (!actx || actx.state !== 'running' || save.muted || headless || !noiseBuf) return;
    const t = actx.currentTime + (delay || 0);
    const s = actx.createBufferSource();
    s.buffer = noiseBuf;
    const f = actx.createBiquadFilter();
    f.type = ftype || 'bandpass'; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f);
    f.connect(g);
    g.connect(master);
    s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.05);
  }
  const sfx = {
    star: p => { const m = 1 + (p || 0) * 0.45; tone(1046 * m, 0.12, 'triangle', 0.1); tone(1568 * m, 0.22, 'triangle', 0.08, null, 0.05); tone(2093 * m, 0.16, 'sine', 0.035, null, 0.09); },
    jump: () => { tone(240, 0.5, 'sine', 0.17, 760); tone(480, 0.32, 'triangle', 0.045, 1150, 0.02); noise(0.25, 0.04, 900, 2600, 1.2); },
    hop: () => { tone(380, 0.26, 'sine', 0.12, 880); tone(760, 0.12, 'triangle', 0.03, 1300, 0.03); },
    boost: () => { noise(0.65, 0.11, 300, 3400, 0.9); tone(220, 0.5, 'sawtooth', 0.03, 880); },
    fall: () => { tone(900, 0.85, 'sine', 0.12, 170); tone(1350, 0.85, 'sine', 0.025, 250); },
    respawn: () => { tone(523, 0.12, 'triangle', 0.09); tone(784, 0.16, 'triangle', 0.09, null, 0.08); tone(1046, 0.22, 'triangle', 0.08, null, 0.16); },
    bump: () => { tone(190, 0.24, 'sine', 0.15, 105); tone(380, 0.12, 'triangle', 0.035, 210); },
    land: () => { tone(110, 0.14, 'sine', 0.15, 60); noise(0.14, 0.05, 600, 200, 0.8, 0, 'lowpass'); },
    check: () => { tone(784, 0.14, 'sine', 0.11); tone(1175, 0.3, 'sine', 0.11, null, 0.1); tone(1568, 0.3, 'triangle', 0.04, null, 0.18); },
    win: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.34, 'triangle', 0.12, null, i * 0.11)); [1046, 1318, 1568].forEach(f => tone(f, 0.9, 'sine', 0.05, null, 0.62)); },
    click: () => tone(700, 0.05, 'sine', 0.07),
    buy: () => [784, 1046, 1568, 2093].forEach((f, i) => tone(f, 0.18, 'triangle', 0.1, null, i * 0.07)),
    nope: () => tone(230, 0.18, 'triangle', 0.07, 175),
    bonus: type => {
      [659, 880, 1175, 1568].forEach((f, i) => tone(f, 0.28, 'triangle', 0.09, null, i * 0.07));
      noise(0.7, 0.035, 2200, 7000, 2.5);
      if (type === 'jump') tone(260, 0.5, 'sine', 0.12, 900, 0.3);
      else if (type === 'fly') noise(0.9, 0.09, 220, 2600, 0.7, 0.25);
      else if (type === 'magnet') { tone(330, 0.6, 'sine', 0.06, 340, 0.3); tone(495, 0.6, 'sine', 0.04, 500, 0.3); }
      else if (type === 'shield') { tone(420, 0.3, 'sine', 0.1, 820, 0.3); tone(620, 0.2, 'sine', 0.05, 1100, 0.42); }
    },
    rescue: () => { noise(0.6, 0.07, 400, 2200, 1); tone(330, 0.6, 'sine', 0.11, 700); },
    pop: () => { tone(900, 0.09, 'sine', 0.11, 280); noise(0.09, 0.07, 3200, 1500, 1.5); },
    tick: () => tone(1318, 0.07, 'sine', 0.05),
    zip: () => tone(1500, 0.1, 'sine', 0.035, 2500),
    teeter: () => tone(310, 0.16, 'triangle', 0.05, 260),
    flap: () => noise(0.12, 0.025, 700, 320, 1)
  };
  function setRoll(amount, speed, now) {
    if (!roll || !actx || actx.state !== 'running') return;
    if (now - roll.last < 0.06) return;
    roll.last = now;
    const t = actx.currentTime;
    roll.g.gain.setTargetAtTime(save.muted || headless ? 0 : amount * 0.055, t, 0.08);
    roll.f.frequency.setTargetAtTime(220 + speed * 75, t, 0.12);
  }

  // ---------- Renderer ----------

    $('prevLvl').disabled = lvl.n <= 1;
    $('nextLvl').disabled = lvl.n >= save.best;
    document.querySelectorAll('#speedSeg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.s === save.speed)));
    $('ageHint').textContent = AGE_TEXT[save.speed];
    $('soundLabel').textContent = save.muted ? 'Sound off' : 'Sound on';
    $('soundIcon').setAttribute('href', save.muted ? '#i-mute' : '#i-sound');
    $('menuLvl').textContent = 'Level ' + lvl.n;
    $('themeName').textContent = lvl.world.name;
    drawBallIcon();
    refreshStars(false);
  }
  let progressShown = -1;
  function setProgress(f) { const v = Math.round(clamp(f, 0, 1) * 400); if (v === progressShown) return; progressShown = v; $('barFill').style.transform = 'scaleX(' + (v / 400).toFixed(4) + ')'; }
  function onLevelLoaded() {
    const lv = lvl;
    levelStars = 0; lastCp = 0; lastCpIdx = 0; rollIn = 1; cleanSection = true; helpedSections = 0; idleAmt = 1;
    meter.n = 0; meter.need = Math.max(lv.P.meter, Math.round(lv.starTotal / 2.5));   // the jar fills about 2 to 3 times a level
    resetBallAt(START_S);
    lastBX = ball.x; lastBZ = ball.z; camY = ball.y;
    updateCamera(0, true);
    if (headless) return;
    $('lvlLabel').textContent = 'Level ' + lv.n;
    $('hudWorld').textContent = lv.world.name;
    $('menuLvl').textContent = 'Level ' + lv.n;
    $('themeName').textContent = lv.world.name;
    progressShown = -1; setProgress(0);
    refreshMeter(); refreshBonusHud();
    try { renderer.compile(scene, camera); } catch (e) {}
  }
  function hideOverlays() { $('hint').hidden = true; $('tapGo').hidden = true; $('announce').hidden = true; hintTimer = 0; }
  function startPlay() {
    if (!ensureBoot()) return;
    audio(); sfx.click();
    state = 'playing'; rollIn = 0;
    showScreen(null); $('hud').hidden = false; $('hud2').hidden = false; hideOverlays();
    steerTotal = 0;
    if (lvl.n <= 2 && !save.hinted) { $('hint').hidden = false; hintTimer = 6; save.hinted = lvl.n === 2; persist(); }
    clock.getDelta();
  }
  function go() { if (state !== 'ready') return; audio(); state = 'playing'; rollIn = 0; $('tapGo').hidden = true; sfx.click(); }
  function pause() {
    if (state !== 'playing' && state !== 'falling' && state !== 'finishing' && state !== 'ready') return;
    prevState = state; state = 'paused'; showScreen('paused'); saveNow();
    $('hint').hidden = true; $('tapGo').hidden = true;   // nothing peeks out from under the pause panel
    if (roll && actx) roll.g.gain.setTargetAtTime(0, actx.currentTime, 0.05);
  }
  function resume() {
    if (state !== 'paused') return;
    audio(); sfx.click(); state = prevState; showScreen(null);
    if (hintTimer > 0) $('hint').hidden = false;
    if (state === 'ready') $('tapGo').hidden = false;
    clock.getDelta();
  }
  function goHome() {
    resetBonuses(true);
    loadLevel(clamp(save.level, 1, save.best));
    state = 'menu'; $('hud').hidden = true; $('hud2').hidden = true; hideOverlays();
    showScreen('menu'); refreshMenu();
  }
  function showComplete() {
    state = 'complete';
    if (headless) return;
    $('doneTitle').textContent = 'Level ' + lvl.n + ' done!';
    $('doneStars').textContent = levelStars + 10;
    $('hud').hidden = true; $('hud2').hidden = true; hideOverlays();
    showScreen('complete'); refreshStars(false);
    const box = $('confetti'); box.innerHTML = '';
    const cols = ['#ff4f9e', '#ffc531', '#45bfff', '#39e06c', '#8a5cff'];
    for (let k = 0; k < 40; k++) {
      const i = document.createElement('i');
      i.style.left = (Math.random() * 100) + '%'; i.style.background = cols[k % cols.length];
      i.style.animationDuration = (1.6 + Math.random() * 1.4) + 's'; i.style.animationDelay = (Math.random() * 0.6) + 's';
      box.appendChild(i);
    }
    // while the child enjoys the result, prepare the next world's textures and sky reflection so 'Next level' is quick
    const n = lvl.n;
    setTimeout(() => { if (state === 'complete' && lvl && lvl.n === n) warmWorld(worldFor(n + 1)); }, 900);
  }
  function warmWorld(W) {
    try { deckSet(W.deck); if (W.bridge !== 'glass') deckSet('steel'); railMat(W); buildEnvironment(W); } catch (e) {}
  }
  function nextLevel() { loadLevel(lvl.n + 1); startPlay(); }

  // ---------- Ball shop ----------
  // Ball pictures are painted one per frame behind a soft placeholder, so the shop opens at once on the first visit.
  const thumbJobs = [];
  let thumbPump = 0;
  function shopPicture(id) {
    if (thumbCache[id + 144]) return thumb(id, 144);
    const [c, g] = canvas2d(144), gr = g.createRadialGradient(54, 48, 6, 72, 72, 70);
    gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0.08)');
    g.fillStyle = gr; g.beginPath(); g.arc(72, 72, 69, 0, TAU); g.fill();
    thumbJobs.push([c, id]);
    if (!thumbPump) thumbPump = requestAnimationFrame(pumpThumbs);
    return c;
  }
  function pumpThumbs() {
    thumbPump = 0;
    const job = thumbJobs.shift();
    if (!job) return;
    const src = thumb(job[1], 144), g = job[0].getContext('2d');
    g.clearRect(0, 0, 144, 144); g.drawImage(src, 0, 0);
    if (thumbJobs.length) thumbPump = requestAnimationFrame(pumpThumbs);
  }
  function renderShop() {
    const grid = $('shopGrid'); grid.innerHTML = '';
    SKINS.forEach(s => {
      const owned = save.owned.includes(s.id), chosen = save.skin === s.id;
      const b = document.createElement('button');
      b.className = 'ballitem' + (owned ? '' : ' locked') + (chosen ? ' chosen' : '');
      b.setAttribute('aria-label', s.name + (chosen ? ', chosen' : owned ? ', tap to use' : ', costs ' + s.price + ' stars'));
      b.appendChild(shopPicture(s.id));
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name; b.appendChild(nm);
      const st = document.createElement('span');
      st.className = 'st' + (!owned && save.stars >= s.price ? ' can' : '');
      if (chosen) st.textContent = 'Chosen';
      else if (owned) st.textContent = 'Use';
      else st.innerHTML = '<svg><use href="#i-star"/></svg>' + s.price;
      b.appendChild(st);
      b.addEventListener('click', () => {
        audio();
        if (owned) { save.skin = s.id; sfx.click(); }
        else if (save.stars >= s.price) { save.stars -= s.price; save.owned.push(s.id); save.skin = s.id; sfx.buy(); toast('New ball: ' + s.name, 1.4); }
        else {
          sfx.nope(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
          toast('Collect ' + (s.price - save.stars) + ' more stars', 1.4);
          return;
        }
        persist(); applySkin(save.skin); renderShop(); refreshStars(false); drawBallIcon();
      });
      grid.appendChild(b);
    });
    refreshStars(false);
  }

  // ---------- Input: slide to steer, arrow keys or A/D ----------
  // Only one finger steers: a second finger or a resting palm can tap to go but never moves the ball,
  // and lifting it does not stop the steering finger.
  let dragging = false, lastPX = 0, dragAcc = 0, dragActive = false, activeId = null;
  const pxToM = () => 8 / clamp(viewW, 320, 1200);
  canvas.addEventListener('pointerdown', e => {
    audio();
    if (activeId !== null && !e.isPrimary) { if (state === 'ready') go(); return; }
    activeId = e.pointerId;
    dragging = true; fingerDown = true; lastPX = e.clientX; dragAcc = 0; dragActive = false;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    if (state === 'ready') go();
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== activeId) return;
    const dx = e.clientX - lastPX; lastPX = e.clientX;
    if (!dragActive) { dragAcc += dx; if (Math.abs(dragAcc) < 5) return; dragActive = true; }
    if (state === 'playing') { ball.tgt += dx * pxToM(); steerTotal += Math.abs(dx); }
  });
  const endDrag = e => {
    if (e && e.pointerId != null && e.pointerId !== activeId) return;
    activeId = null; dragging = false; fingerDown = false;
  };
  canvas.addEventListener('pointerup', e => { audio(); endDrag(e); });   // a finger lift counts as a tap for unlocking sound
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('lostpointercapture', endDrag);
  document.addEventListener('touchend', () => { audio(); }, { capture: true, passive: true });
  window.addEventListener('keydown', e => {
    const k = e.key, onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.keyL = true; steerTotal += 20; if (state === 'ready') go(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.keyR = true; steerTotal += 20; if (state === 'ready') go(); }
    else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'paused') resume(); else pause(); }
    else if (k === 'Enter' || k === ' ') {
      if (onButton && state !== 'playing' && state !== 'ready') return;
      audio();
      if (state === 'menu') startPlay();
      else if (state === 'complete') nextLevel();
      else if (state === 'paused') resume();
      else if (state === 'ready') go();
      else return;
    } else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.keyL = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.keyR = false;
  });
  window.addEventListener('blur', () => { input.keyL = input.keyR = false; endDrag(); });

  // The menu is on screen before start-up has finished (it waits a moment for the web font): a tap there finishes it first.
  $('playBtn').addEventListener('click', startPlay);
  $('prevLvl').addEventListener('click', () => { if (!ensureBoot()) return; if (lvl.n > 1) { audio(); sfx.click(); save.level = lvl.n - 1; persist(); loadLevel(save.level); refreshMenu(); } });
  $('nextLvl').addEventListener('click', () => { if (!ensureBoot()) return; if (lvl.n < save.best) { audio(); sfx.click(); save.level = lvl.n + 1; persist(); loadLevel(save.level); refreshMenu(); } });
  document.querySelectorAll('#speedSeg button').forEach(b => b.addEventListener('click', () => { if (!ensureBoot()) return; audio(); save.speed = +b.dataset.s; persist(); sfx.click(); refreshMenu(); }));
  $('soundBtn').addEventListener('click', () => { if (!ensureBoot()) return; audio(); save.muted = !save.muted; persist(); sfx.click(); refreshMenu(); });
  $('shopBtn').addEventListener('click', () => { if (!ensureBoot()) return; audio(); sfx.click(); state = 'shop'; renderShop(); showScreen('shop'); });
  $('shopDone').addEventListener('click', () => { sfx.click(); state = 'menu'; showScreen('menu'); refreshMenu(); });
  $('pauseBtn').addEventListener('click', pause);
  $('resumeBtn').addEventListener('click', resume);
  $('restartBtn').addEventListener('click', () => { const n = lvl.n; resetBonuses(true); loadLevel(n); startPlay(); });
  $('quitBtn').addEventListener('click', goHome);
  $('nextBtn').addEventListener('click', nextLevel);
  $('homeBtn').addEventListener('click', goHome);

  // ---------- Loop ----------
  const clock = new THREE.Clock();
  const _focus = new THREE.Vector3();
  let loopOn = false, menuAcc = 0, menuFrames = 0;
  function tick() {
    const raw = clock.getDelta();
    if (state !== 'paused') governor(raw);
    let dt = Math.min(raw, 1 / 20);
    // the menu, shop and level-done screens sit under blurred glass: draw them at 30 or 20 frames a second to save battery
    if (state === 'menu' || state === 'shop' || state === 'complete') {
      menuAcc += dt;
      if (++menuFrames < (state === 'menu' ? 2 : 3)) return;
      dt = Math.min(menuAcc, 0.1); menuAcc = 0; menuFrames = 0;
    } else { menuAcc = 0; menuFrames = 0; }
    frame(dt);
  }
  function frame(dt) {
    if (!lvl) return;
    if (state === 'paused') { if (!pausedDrawn) { pausedDrawn = true; renderer.render(scene, camera); } return; }
    pausedDrawn = false;
    gt += dt;
    simStep(dt);
    if (state === 'menu' || state === 'shop') ballMesh.rotateY(dt * 0.6);
    if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0 || steerTotal > 90) { hintTimer = 0; $('hint').hidden = true; } }
    updateBallVisual(dt);
    updateStars(gt, dt); updatePickups(gt, dt);
    sparks.update(dt); dust.update(dt); updateConfetti(dt); updateStreaks(dt); updateHelperLooks(dt);
    updateCamera(dt, false);
    sky.position.copy(camera.position);
    if (mountains) mountains.position.set(camera.position.x, 0, camera.position.z);
    _focus.set(ball.x, ball.y, ball.z - SH * 0.5); updateSun(_focus);
    seaMat.uniforms.uTime.value = gt % 1000;
    cloudTexA.offset.x += dt * 0.002; cloudTexB.offset.x += dt * 0.0012;
    boostTex.offset.y = (boostTex.offset.y + dt * 1.4) % 1;
    if (state === 'playing' || state === 'finishing') setProgress((ball.s - START_S) / (lvl.finish * L + 0.8 - START_S));
    const rolling = ball.mode === 'roll' && (state === 'playing' || state === 'finishing');
    setRoll(rolling ? clamp(ball.fwd / 6, 0, 1) : 0, ball.fwd, gt);
    renderer.render(scene, camera);
  }
  function startLoop() { if (loopOn) return; loopOn = true; pausedDrawn = false; clock.getDelta(); renderer.setAnimationLoop(tick); }
  function stopLoop() { loopOn = false; renderer.setAnimationLoop(null); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pause(); saveNow(); stopLoop(); if (roll && actx) roll.g.gain.setTargetAtTime(0, actx.currentTime, 0.05); }
    else startLoop();
  });
  // Only unsaved progress is written on the way out, so closing an older tab never rolls back what a newer tab saved.
  window.addEventListener('pagehide', () => { saveNow(); });
  // Another tab saved: take in its progress (never lowering anything) while this tab is not in the middle of a level.
  window.addEventListener('storage', e => {
    if (e.key !== SAVE_KEY || !e.newValue || !lvl || (state !== 'menu' && state !== 'shop' && state !== 'complete')) return;
    try {
      const s = JSON.parse(e.newValue);
      if (!s || typeof s !== 'object') return;
      const oldSkin = save.skin, owned = Array.isArray(s.owned) ? s.owned : [];
      save.best = Math.max(save.best | 0, s.best | 0); save.stars = Math.max(save.stars | 0, s.stars | 0);
      save.owned = save.owned.concat(owned.filter(id => save.owned.indexOf(id) < 0));
      for (const k of ['level', 'skin', 'speed', 'muted', 'hinted']) if (k in s) save[k] = s[k];
      tidySave();
      if (save.skin !== oldSkin) applySkin(save.skin);
      if (state === 'shop') renderShop();
      if (state === 'menu') refreshMenu(); else refreshStars(false);
    } catch (err) {}
  });
  canvas.addEventListener('webglcontextrestored', () => { resetEnvironments(); if (curWorld) { envRT = buildEnvironment(curWorld); scene.environment = envRT.texture; } }, false);

  // ---------- Start ----------
  function tidySave() {
    if (!Array.isArray(save.owned)) save.owned = [];
    save.owned = save.owned.filter(id => SKIN_BY_ID[id]);
    if (save.owned.indexOf('selena') < 0) save.owned.unshift('selena');
    save.stars = Math.max(0, save.stars | 0);
    save.speed = clamp(save.speed | 0, 0, 2);
    save.best = Math.max(1, save.best | 0);
    save.level = clamp(save.level | 0, 1, save.best);
    save.muted = !!save.muted; save.hinted = !!save.hinted;
    if (!SKIN_BY_ID[save.skin] || save.owned.indexOf(save.skin) < 0) save.skin = 'selena';
  }
  let booted = false, fontsDone = false, bootFontsOK = false;
  function ensureBoot() { if (!booted) boot(); return !!lvl; }
  function boot() {
    if (booted) return;
    booted = true; bootFontsOK = fontsDone;
    tidySave();
    const oldBanner = MAT.banner.map; MAT.banner.map = bannerTexture(); oldBanner.dispose();
    applySkin(save.skin);
    loadLevel(save.level);
    state = 'menu'; $('hud').hidden = true; $('hud2').hidden = true; hideOverlays();
    showScreen('menu'); refreshMenu();
    startLoop();
    if (DEBUG) installDebug();
  }
  // The web font arrived after start-up: redraw the pictures painted with it (finish banner, Selena ball) and re-fit the menu.
  function repaintFontPictures() {
    const oldBanner = MAT.banner.map; MAT.banner.map = bannerTexture(); oldBanner.dispose();
    for (const k in thumbCache) if (k.indexOf('selena') === 0) delete thumbCache[k];
    releaseSkin('selena');
    if (save.skin === 'selena') applySkin('selena');
    drawBallIcon();
    if (state === 'shop') renderShop();
    menuLayoutDirty = true;
  }

  // ---------- Test hook (only when the page address contains "debug") ----------
  function installDebug() {
    const names = { jump: 'jump', superjump: 'jump', fly: 'fly', flying: 'fly', flyingball: 'fly', magnet: 'magnet', starmagnet: 'magnet', shield: 'shield', bubble: 'shield', bubbleshield: 'shield' };
    function simulate(n, opts) {
      opts = opts || {};
      const react = opts.react == null ? 1.3 : opts.react, wobble = opts.wobble == null ? 0.4 : opts.wobble;
      const keep = { speed: save.speed, stars: save.stars, best: save.best, level: save.level }, keepState = state;
      headless = true; botNoBonus = !opts.bonuses;
      save.speed = opts.speed == null ? 1 : opts.speed;
      let res = null;
      try {
        loadLevel(n);
        state = 'playing'; rollIn = 1;
        const hist = [], ph = (n * 1.7) % TAU, secF = {}, fallAt = [], trace = [], kinds = ['jump', 'fly', 'magnet', 'shield'];
        let t = 0, falls = 0, nextSpam = 2, spamI = (n * 3) % 4, rescues = 0, flights = 0, hops = 0, lastMode = '';
        while (t < (opts.maxT || 420) && state !== 'complete') {
          t += 1 / 60;
          if (state === 'ready') { state = 'playing'; rollIn = 0; }
          const v = levelSpeed();
          hist.push(safeAt(ball.s + v * (react + 0.4)));
          const idx = hist.length - 1 - Math.round(react * 60);
          if (!opts.noTouch) { ball.tgt = (idx >= 0 ? hist[idx] : 0) + Math.sin(t * 1.3 + ph) * wobble; fingerDown = true; }
          else fingerDown = false;
          if (opts.spam && t >= nextSpam && state === 'playing') { nextSpam = t + opts.spam; if (bonus.type) resetBonuses(false); grant(kinds[spamI++ % 4], 'debug'); }
          if (opts.dive && bonus.type === 'shield' && ball.mode === 'roll') ball.tgt = (Math.floor(t * 0.7) % 2 ? 1 : -1) * (wAt(ball.s) / 2 + 1.6);
          const before = state;
          simStep(1 / 60);
          if (opts.trace) { const o = lvl.obstacles.find(q => Math.abs(q.s - ball.s) < 4 && q.type === 'spinner'); trace.push([+t.toFixed(2), +ball.s.toFixed(2), +ball.lat.toFixed(2), +ball.tgt.toFixed(2), +ball.fwd.toFixed(2), o ? +(o.ang % TAU).toFixed(2) : null, +vt.toFixed(2), +ball.holdT.toFixed(2)]); if (trace.length > opts.trace) trace.shift(); }
          if (ball.mode !== lastMode) { if (ball.mode === 'rescue') rescues++; if (ball.mode === 'fly') flights++; if (ball.mode === 'arc' && ball.arc.kind === 'sj') hops++; lastMode = ball.mode; }
          if (state === 'falling' && before !== 'falling') { falls++; secF[lastCpIdx] = (secF[lastCpIdx] || 0) + 1; if (fallAt.length < 6) fallAt.push(+ball.s.toFixed(1) + ':' + ball.lat.toFixed(2) + ':' + ball.mode); }
        }
        let maxSec = 0; for (const k in secF) maxSec = Math.max(maxSec, secF[k]);
        const st = stepAt(ball.s), near = lvl.chal.filter(c => Math.abs(c.s0 - st) < 14).map(c => c.type + '@' + c.s0).join(',');
        res = { level: n, finished: state === 'complete', time: +t.toFixed(1), falls, sections: lvl.cps.length, maxSectionFalls: maxSec, stars: levelStars, starTotal: lvl.starTotal, obstacles: lvl.obstacles.length, challenges: lvl.chal.length, fallAt, trace, rescues, flights, hops, end: { s: +ball.s.toFixed(2), step: st, lat: +ball.lat.toFixed(2), mode: ball.mode, state, fwd: +ball.fwd.toFixed(2), gap: lvl.gap[st], kind: lvl.kind[st], near } };
      } finally {
        headless = false; botNoBonus = false; fingerDown = false;
        Object.assign(save, keep);
        loadLevel(save.level); state = keepState === 'menu' ? 'menu' : 'menu';
        showScreen('menu'); $('hud').hidden = true; $('hud2').hidden = true; hideOverlays(); refreshMenu(); refreshStars(false);
      }
      return res;
    }
    window.selenaDebug = {
      grant(type) {
        const t = names[String(type || '').toLowerCase().replace(/[\s_-]/g, '')];
        if (!t || !lvl) return false;
        if (state === 'menu' || state === 'shop') startPlay();
        if (state === 'ready') go();
        if (bonus.type && bonus.type !== t) resetBonuses(false);
        return grant(t, 'debug');
      },
      level(n) { n = Math.max(1, n | 0); resetBonuses(true); loadLevel(n); state = 'menu'; showScreen('menu'); refreshMenu(); return lvl.world.name; },
      play() { startPlay(); return state; },
      skipTo(s) { if (!lvl) return; resetBallAt(clamp(+s, 1, lvl.finish * L - 2)); updateCamera(0, true); return ball.s; },
      state() {
        // draw one frame with the counters kept, so the shadow pass is included in calls and triangles
        const i = renderer.info;
        i.autoReset = false; i.reset(); renderer.render(scene, camera);
        const calls = i.render.calls, triangles = i.render.triangles;
        i.autoReset = true;
        return { state, level: lvl.n, world: lvl.world.name, s: +ball.s.toFixed(2), lat: +ball.lat.toFixed(2), y: +ball.y.toFixed(2), mode: ball.mode, bonus: bonus.type, t: +bonus.t.toFixed(2), queue: bonus.queue, stars: levelStars, meter: meter.n + '/' + meter.need, calls, triangles, programs: i.programs.length, textures: i.memory.textures, geometries: i.memory.geometries };
      },
      simulate,
      programs() { return renderer.info.programs.map(p => p.name + ' | ' + String(p.cacheKey).split(',').slice(0, 12).join(',')); },
      steer(lat) { ball.tgt = +lat; return ball.tgt; },
      obstacles() { return lvl.obstacles.map(o => o.type + '@' + o.s.toFixed(1) + ' lat ' + o.lat.toFixed(2) + ' safe ' + o.safe.toFixed(2) + (o.clear != null ? ' clr ' + o.clear.toFixed(2) : '')); },
      info() { const lv = lvl; return { n: lv.n, N: lv.N, cps: lv.cps.slice(), chal: lv.chal.map(c => c.type + '@' + c.s0), pickups: lv.pickups.map(p => p.type + '@' + Math.round(p.s / L)), stars: lv.stars.length, intro: lv.P.intro, railPct: lv.P.railPct }; }
    };
  }

  const fontsReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('900 64px "Rubik"'), document.fonts.load('800 16px "Rubik"')]).catch(() => {}) : Promise.resolve();
  fontsReady.then(() => { fontsDone = true; if (booted && !bootFontsOK) { bootFontsOK = true; repaintFontPictures(); } });
  Promise.race([fontsReady, new Promise(res => setTimeout(res, 1500))]).then(boot);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
