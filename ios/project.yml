# XcodeGen spec for the Selena Roller iPhone app.
# The build runs `xcodegen generate` in this folder; the generated SelenaRoller.xcodeproj is not kept in git.
# The game itself (index.html, three.min.js, fonts/, icons, manifest) stays at the repository root and is
# copied into the app at build time by scripts/bundle-web.sh.
name: SelenaRoller

options:
  deploymentTarget:
    iOS: "17.0"            # iPhone XS / XR (2018) and newer
  developmentLanguage: en
  createIntermediateGroups: true

targets:
  SelenaRoller:
    type: application
    platform: iOS
    sources:
      - path: SelenaRoller   # Swift files, Info.plist, PrivacyInfo.xcprivacy and Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozduy.selenaroller
        INFOPLIST_FILE: SelenaRoller/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"           # the App Store version
        CURRENT_PROJECT_VERSION: "1"       # the build number; CI sets it to the run number and attempt, e.g. 12.1
        TARGETED_DEVICE_FAMILY: "1"        # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO  # the copy script reads the game from the repository root
    postBuildScripts:
      - name: Copy the web game into the app
        script: |
          /bin/sh "${SRCROOT}/scripts/bundle-web.sh"
        basedOnDependencyAnalysis: false   # run on every build, so the app always has the current game
        showEnvVars: false

schemes:
  SelenaRoller:
    build:
      targets:
        SelenaRoller: all
    run:
      config: Debug
    archive:
      config: Release
