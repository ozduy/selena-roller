# Builds the Selena Roller iPhone app on a GitHub-hosted Mac.
# - Every push that touches the app or the web game: a simulator build with no signing, then a launch check
#   with a screenshot (the build fails if the app does not keep running).
# - Run it by hand (Actions > iOS app > Run workflow) with "upload" ticked: archive, sign with Apple's
#   cloud-managed certificate and upload to App Store Connect / TestFlight. ios/README.md lists the secrets.
name: iOS app

on:
  push:
    branches: [ios-app, main]
    paths:
      - ".github/workflows/ios.yml"
      - "ios/**"
      - "index.html"
      - "three.min.js"
      - "manifest.webmanifest"
      - "fonts/**"
      - "icon-*.png"
      - "THIRD-PARTY-NOTICES.txt"
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive, sign and upload the build to App Store Connect (TestFlight)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push cancels an older push build; manual runs (uploads) are never cancelled.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # Xcode 26.6 with the iOS 26.5 SDK. App Store Connect has required the iOS 26 SDK or later since April 2026.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  APP_NAME: SelenaRoller
  BUNDLE_ID: com.ozduy.selenaroller
  # XcodeGen comes from its own GitHub release, checked against the SHA-256 that GitHub lists for xcodegen.zip,
  # so the upload job (which handles the signing key) never runs an unpinned installer.
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

defaults:
  run:
    shell: bash
    working-directory: ios

jobs:
  simulator:
    name: Simulator build (no signing)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (what each tag pointed to when this was written), so a moved tag
      # cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Xcode and the iOS SDK
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error title=Xcode not found::$DEVELOPER_DIR is not on this runner image. Choose an installed Xcode 26 or later and update DEVELOPER_DIR in .github/workflows/ios.yml."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error title=iOS SDK too old::App Store Connect only accepts apps built with the iOS 26 SDK or later; this Xcode has iOS $SDK."
            exit 1
          fi

      - name: Check the app icon
        run: |
          ICON=SelenaRoller/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          INFO=$(sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON")
          echo "$INFO"
          if [[ "$INFO" != *"pixelWidth: 1024"* || "$INFO" != *"pixelHeight: 1024"* ]]; then
            echo "::warning title=App icon size::$ICON should be 1024 x 1024 pixels."
          fi
          if [[ "$INFO" == *"hasAlpha: yes"* ]]; then
            echo "::warning title=App icon transparency::$ICON has an alpha channel. App Store Connect rejects that (ITMS-90717), so the upload job will stop."
          fi

      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          GOT=$(shasum -a 256 "$RUNNER_TEMP/xcodegen.zip" | cut -d ' ' -f 1)
          if [ "$GOT" != "$XCODEGEN_SHA256" ]; then
            echo "::error title=XcodeGen download::xcodegen.zip $XCODEGEN_VERSION does not have the expected SHA-256 (got $GOT)."
            exit 1
          fi
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: |
          xcodegen --version
          xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project "$APP_NAME.xcodeproj" -scheme "$APP_NAME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Check what went into the app
        run: |
          APP="build/dd/Build/Products/Debug-iphonesimulator/$APP_NAME.app"
          for f in web/index.html web/three.min.js web/fonts/rubik.css web/fonts/rubik-latin.woff2 web/fonts/OFL.txt \
                   web/THIRD-PARTY-NOTICES.txt PrivacyInfo.xcprivacy Assets.car; do
            if [ ! -e "$APP/$f" ]; then
              echo "::error title=Missing from the app::$f is not in $APP_NAME.app"
              exit 1
            fi
          done
          plutil -p "$APP/Info.plist"
          ls -la "$APP/web" "$APP/web/fonts"

      # Starting the simulator may fail for reasons that have nothing to do with the app (no simulator on the runner
      # image, a slow first boot), so that part only warns. Once it has started, the launch check below is strict.
      - name: Start an iPhone simulator
        id: boot
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RUNTIME=$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.identifier | contains("SimRuntime.iOS"))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          UDID=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "$RUNTIME" '[.devices[$rt][]? | select(.name | startswith("iPhone"))] | (map(select(.name == "iPhone 17 Pro")) + .) | .[0].udid // empty')
          if [ -z "$UDID" ]; then
            echo "::warning::No iPhone simulator found, so the launch check was skipped."
            exit 0
          fi
          echo "Runtime $RUNTIME, device $UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Launch the app in the simulator and take a screenshot
        if: steps.boot.outcome == 'success' && steps.boot.outputs.udid != ''
        timeout-minutes: 8
        env:
          UDID: ${{ steps.boot.outputs.udid }}
        run: |
          APP="build/dd/Build/Products/Debug-iphonesimulator/$APP_NAME.app"
          # A local ad hoc signature lets the simulator run the unsigned build (no Apple account involved).
          codesign --force --sign - --timestamp=none "$APP"
          xcrun simctl install "$UDID" "$APP"
          LAUNCH=$(xcrun simctl launch "$UDID" "$BUNDLE_ID")
          echo "$LAUNCH"
          PID=$(printf '%s\n' "$LAUNCH" | sed -nE 's/.*: *([0-9]+)$/\1/p' | tail -n 1)
          sleep 25
          xcrun simctl io "$UDID" screenshot build/simulator.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "SelenaRoller"' | tail -n 80 || true
          # The app must still be running. A crash at launch fails this job, which also stops the upload job.
          if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
            echo "$APP_NAME is still running 25 seconds after launch (pid $PID)."
          elif xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "UIKitApplication:$BUNDLE_ID"; then
            echo "$APP_NAME is still running 25 seconds after launch."
          else
            echo "::error title=App not running::$APP_NAME stopped within 25 seconds of launch. The log above shows why."
            exit 1
          fi

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulator-screenshot
          path: ios/build/simulator.png
          if-no-files-found: ignore
          retention-days: 7

  upload:
    name: Archive, sign and upload to App Store Connect
    needs: simulator
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8_BASE64" ] || missing="$missing ASC_KEY_P8_BASE64"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::These repository secrets are not set:$missing. Add them under Settings > Secrets and variables > Actions (see ios/README.md), then run the workflow again."
            exit 1
          fi
          # Format checks only; the values themselves are never printed.
          TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          bad=""
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || bad="$bad APPLE_TEAM_ID (10 capital letters and digits)"
          [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || bad="$bad ASC_KEY_ID (10 capital letters and digits)"
          [[ "$ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || bad="$bad ASC_ISSUER_ID (a UUID)"
          if [ -n "$bad" ]; then
            echo "::error title=Secrets look wrong::Expected formats:$bad. See ios/README.md."
            exit 1
          fi
          echo "All four signing secrets are set."

      - name: Check Xcode and the iOS SDK
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error title=Xcode not found::$DEVELOPER_DIR is not on this runner image. Choose an installed Xcode 26 or later and update DEVELOPER_DIR in .github/workflows/ios.yml."
            exit 1
          fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error title=iOS SDK too old::App Store Connect only accepts apps built with the iOS 26 SDK or later; this Xcode has iOS $SDK."
            exit 1
          fi

      - name: Check the app icon
        run: |
          ICON=SelenaRoller/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          INFO=$(sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON")
          echo "$INFO"
          if [[ "$INFO" == *"hasAlpha: yes"* ]]; then
            echo "::error title=App icon transparency::$ICON has an alpha channel. App Store Connect rejects that (ITMS-90717). Save it as a PNG without transparency."
            exit 1
          fi

      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          GOT=$(shasum -a 256 "$RUNNER_TEMP/xcodegen.zip" | cut -d ' ' -f 1)
          if [ "$GOT" != "$XCODEGEN_SHA256" ]; then
            echo "::error title=XcodeGen download::xcodegen.zip $XCODEGEN_VERSION does not have the expected SHA-256 (got $GOT)."
            exit 1
          fi
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: |
          xcodegen --version
          xcodegen generate

      - name: Archive (unsigned; signing happens at export)
        env:
          # Run number and attempt, for example 12.1. A re-run of the same run gets 12.2, so Apple never sees a
          # build number twice.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          xcodebuild archive \
            -project "$APP_NAME.xcodeproj" -scheme "$APP_NAME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | xcbeautify --renderer github-actions

      - name: Check the archive
        run: |
          APP="$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          if [ ! -f "$APP/web/index.html" ]; then
            echo "::error title=Archive incomplete::The web game is missing from the archived app."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' \
            -c 'Print :CFBundleVersion' -c 'Print :DTSDKName' -c 'Print :DTXcode' "$APP/Info.plist"

      - name: Export, sign and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          KEY_DIR="$RUNNER_TEMP/asc-key"
          KEY="$KEY_DIR/AuthKey_$KEY_ID.p8"
          umask 077
          mkdir -p "$KEY_DIR"
          # The secret holds the .p8 file as base64. If the plain key text was stored instead, use it as it is.
          if [[ "$ASC_KEY_P8_BASE64" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$KEY.raw"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$KEY.raw" 2>/dev/null || true
          fi
          tr -d '\r' < "$KEY.raw" > "$KEY"
          rm -f "$KEY.raw"
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY"; then
            echo "::error title=ASC_KEY_P8_BASE64::The secret is not a base64-encoded .p8 private key. Store the base64 of the whole AuthKey_XXXXXXXXXX.p8 file (see ios/README.md)."
            exit 1
          fi
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "::notice title=Uploaded::Build $BUILD_NUMBER went to App Store Connect. Apple emails when it has been processed; it then appears under TestFlight."

      - name: Show the end of the distribution log
        if: failure()
        working-directory: .
        run: |
          LOG=$(find "$RUNNER_TEMP" "${TMPDIR:-/tmp}" -name 'IDEDistribution.standard.log' 2>/dev/null | head -n 1 || true)
          if [ -n "$LOG" ]; then
            tail -n 150 "$LOG"
          else
            echo "No distribution log was written."
          fi

      - name: Delete the key file
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/asc-key"
